<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="의약품·원료 수출입 단가 협상 대시보드: UN Comtrade 단가 판정, 식약처 DMF 경쟁사·제조소, 국가별 PIC/S 규제 정보">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>PharmaPrice Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 소개(체험·화면 안내·사용 예시·용어) → 로그인 → 사이드바 앱 셸. 상단 바에서 품목 검색·보고국·기간을 고르면 모든 화면이 그 데이터로 계산된다. */
:root{
  --bg:#EEF1EB; --surface:#FFFFFF; --surface-2:#F5F7F2; --ink:#121A15; --ink-2:#2F3933; --muted:#525D56; --line:#D3D9D0;
  --brand:#1F4D3A; --brand-ink:#FFFFFF; --brand-soft:#DCE8DF; --lime:#C9EB6B; --lime-ink:#121A15;
  --good:#17643A; --good-bg:#DDF0E3; --warn:#7D5200; --warn-bg:#F9EDD2; --bad:#9C3510; --bad-bg:#FADFD3;
  --c1:#1F4D3A; --c2:#C2551C; --c3:#2F6FA8; --c4:#7A5BB0; --vol:#C8D7C0; --band:#BFD9A6; --land:#DCE3D8;
  --shadow:0 18px 50px rgba(18,26,21,.08);
  --f-display:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#172019; --surface-2:#1D2820; --ink:#EDF2EB; --ink-2:#CBD5CC; --muted:#A3B0A6; --line:#2F3D33;
  --brand:#9ED8B0; --brand-ink:#0F1511; --brand-soft:#23382B; --lime:#C9EB6B; --lime-ink:#121A15;
  --good:#7FDCA4; --good-bg:#173826; --warn:#F0C060; --warn-bg:#3A2E12; --bad:#FFA584; --bad-bg:#3E2117;
  --c1:#9ED8B0; --c2:#F08A5D; --c3:#7FB3E8; --c4:#C2A8EE; --vol:#2F4436; --band:#3F5E36; --land:#25332A;
  --shadow:0 18px 50px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#172019; --surface-2:#1D2820; --ink:#EDF2EB; --ink-2:#CBD5CC; --muted:#A3B0A6; --line:#2F3D33;
  --brand:#9ED8B0; --brand-ink:#0F1511; --brand-soft:#23382B; --lime:#C9EB6B; --lime-ink:#121A15;
  --good:#7FDCA4; --good-bg:#173826; --warn:#F0C060; --warn-bg:#3A2E12; --bad:#FFA584; --bad-bg:#3E2117;
  --c1:#9ED8B0; --c2:#F08A5D; --c3:#7FB3E8; --c4:#C2A8EE; --vol:#2F4436; --band:#3F5E36; --land:#25332A;
  --shadow:0 18px 50px rgba(0,0,0,.35); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.025em;line-height:1.3}
p{margin:0}
a{color:var(--brand);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sp{flex:1}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(1.08);border-color:var(--brand)}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:10px}
.btn-lg{min-height:56px;padding:0 26px;font-size:17px;border-radius:14px}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
ul.ins{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.6}
.chipbtn{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.trbox{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.chk svg{opacity:0}
.chk[aria-pressed="true"]{border-color:var(--good);color:var(--ink);background:var(--good-bg)}
.chk[aria-pressed="true"] svg{opacity:1}
.rel{margin:10px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.rel li{padding-left:14px;position:relative;line-height:1.55}
.rel li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.rel li.w2:before{background:var(--bad)}.rel li.w0:before{background:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.5}
.t-good{background:var(--good-bg);color:var(--good)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.t-lime{background:var(--lime);color:var(--lime-ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:14px;font-weight:700;color:var(--ink-2)}
.input,.select{min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);width:100%;min-width:0;font-size:16px}
.input:focus,.select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.input.big{min-height:62px;font-size:28px;font-family:var(--f-mono);border:2px solid var(--brand)}
.input.bad{border-color:var(--bad)}
.hint{font-size:13.5px;color:var(--muted);line-height:1.6}
.err{font-size:14px;color:var(--bad);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.card h3{font-size:18px}
.card-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.kpi .k{font-size:14px;color:var(--ink-2);font-weight:700}
.kpi .v{font-family:var(--f-mono);font-size:30px;font-weight:500;margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.kpi .v.ko{font-family:var(--f-display);font-weight:800}
.kpi .s{font-size:13.5px;color:var(--muted);margin-top:6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:720px}
.tbl th{text-align:left;font-size:13px;color:var(--ink-2);font-weight:700;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;min-height:36px}
.tbl th button:focus-visible{outline:2px solid var(--brand)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl tbody tr.on td{background:var(--brand-soft)}
.tbl tbody tr.best td{background:color-mix(in srgb,var(--lime) 30%,var(--surface))}
.tbl tbody tr.dim td{color:var(--muted)}
.bar-mini{display:inline-block;height:8px;border-radius:4px;background:var(--brand);vertical-align:middle}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:9px 12px;border-radius:10px;white-space:nowrap;z-index:5;line-height:1.6;box-shadow:var(--shadow)}
.tip b{font-family:var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;z-index:50;box-shadow:var(--shadow);max-width:calc(100vw - 32px);white-space:normal;text-align:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:#1F4D3A;display:inline-flex;align-items:center;justify-content:center;flex:none}
.logo .beta{font-family:var(--f-body);font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--lime);color:var(--lime-ink)}
.lang{min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.topnav{display:flex;gap:2px;flex-wrap:wrap}
.topnav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:15px}
.topnav a:hover{background:var(--surface)}
@media (max-width:1180px){.topnav{display:none}}
.hero{padding-block:56px 72px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:960px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.12;font-weight:800;letter-spacing:-.045em}
.hero h1 .mark{background:linear-gradient(transparent 62%,var(--lime) 62%);padding:0 4px;color:var(--ink)}
.hero .lead{margin-top:22px;font-size:19px;color:var(--ink-2);max-width:32em;line-height:1.75}
.checks{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:12px;color:var(--ink-2);font-size:16px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li span.ck{width:24px;height:24px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.try{background:var(--surface);border-radius:26px;padding:28px;box-shadow:var(--shadow);border:1px solid var(--line)}
.verdict{border-radius:18px;padding:18px 20px}
.verdict .big{font-family:var(--f-mono);font-size:38px;font-weight:500;letter-spacing:-.03em;line-height:1.2}
.verdict .vt{font-weight:700;margin-top:8px;font-size:17px;line-height:1.55}
.v-good{background:var(--good-bg);color:var(--good)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.v-bad{background:var(--bad-bg);color:var(--bad)}
.v-none{background:var(--surface-2);color:var(--ink-2)}
.ticker{border-block:1px solid var(--line);background:var(--surface);overflow-x:auto}
.ticker .wrap{display:flex;gap:30px;padding-block:15px;white-space:nowrap;font-size:14px}
.ticker .it{display:flex;gap:8px;align-items:baseline}
.sec{padding-block:88px}
.sec h2{font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.28}
.sec .sub{margin-top:14px;color:var(--ink-2);max-width:42em;font-size:17px;line-height:1.8}
.pain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:36px}
@media (max-width:860px){.pain{grid-template-columns:minmax(0,1fr)}}
.pain .card{display:flex;flex-direction:column;gap:10px}
.pain .q{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.4}
.pain p{color:var(--ink-2)}
.pain .fix{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--good);font-weight:700}
.tour{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;margin-top:36px;align-items:start}
@media (max-width:900px){.tour{grid-template-columns:minmax(0,1fr)}}
.tour-tabs{display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){.tour-tabs{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.tour-tabs button{display:flex;gap:10px;align-items:center;text-align:left;min-height:52px;padding:0 16px;border-radius:14px;border:1px solid transparent;background:transparent;font-weight:700;font-size:15.5px;color:var(--ink-2);cursor:pointer;flex:none}
.tour-tabs button:hover{background:var(--surface)}
.tour-tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.tour-panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;min-width:0}
.tour-media{margin:20px 0 4px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface-2)}
.tour-media img{display:block;width:100%;height:auto;aspect-ratio:880/550}
.tour-media figcaption,.banner figcaption{font-size:13px;color:var(--muted);padding:8px 14px}
.banner-sec{padding-top:40px}
.banner{margin:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#F3F5EF}
.banner img{display:block;width:100%;height:auto;aspect-ratio:1200/440}
.banner figcaption{background:var(--surface)}
.tour-panel h3{font-size:26px;font-weight:800}
.tour-panel .lead2{margin-top:10px;color:var(--ink-2);font-size:17px;line-height:1.8;max-width:44em}
.tour-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
@media (max-width:700px){.tour-cols{grid-template-columns:minmax(0,1fr)}}
.tour-cols h4{font-size:15px;color:var(--brand);font-family:var(--f-body);font-weight:700;letter-spacing:0}
.tour-cols ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:15.5px}
.walk{list-style:none;padding:0;margin:36px 0 0;display:flex;flex-direction:column;counter-reset:w}
.walk li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:18px;counter-increment:w;padding-bottom:28px;position:relative}
.walk li::before{content:counter(w);width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:18px;position:relative;z-index:1}
.walk li::after{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.walk li:last-child::after{display:none}
.walk h3{font-size:19px;margin-top:8px}
.walk p{color:var(--ink-2);margin-top:6px;max-width:46em}
.walk .out{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;display:flex;flex-wrap:wrap;gap:8px 20px}
.walk .out b{font-family:var(--f-mono);font-weight:500}
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:32px}
@media (max-width:900px){.gloss{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gloss{grid-template-columns:minmax(0,1fr)}}
.gloss div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.gloss dt{font-weight:700;font-size:16px}
.gloss dt span{font-family:var(--f-mono);color:var(--brand);margin-right:6px}
.gloss dd{margin:6px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.formula{font-family:var(--f-mono);background:#121A15;color:#EDF2EB;border-radius:18px;padding:24px;font-size:14.5px;line-height:2;overflow-x:auto}
.formula .c{color:#9FB0A4}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:700;font-size:17px;display:flex;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-size:24px;color:var(--brand)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 0 22px;color:var(--ink-2);max-width:46em;line-height:1.8}
.cta{background:#1F4D3A;color:#FFFFFF;border-radius:28px;padding:44px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.cta h2{font-size:32px;color:#FFFFFF}
footer.ft{border-top:1px solid var(--line);padding-block:26px;font-size:14px;color:var(--muted)}
.auth{min-height:100%;display:grid;place-items:center;padding-block:48px}

function hsSearch(q,anyScope){
  q=q.trim().toLowerCase();if(!q)return [];
  const digits=q.replace(/[\s.\-]/g,'');
  const out=[];
  if(/^\d{2,10}$/.test(digits)){const d6=digits.slice(0,6);
    REF.hs.forEach(h=>{if((anyScope||inScope(h.code))&&h.code.startsWith(d6))out.push({h,s:200-(h.code.length-digits.length)*10})});
  }else{
    const toks=q.split(/\s+/).filter(Boolean);
    REF.hs.forEach(h=>{if(!anyScope&&!inScope(h.code))return;let s=0;const ko=(h.ko||'').toLowerCase(),kw=(h.kw||'').toLowerCase(),en=h.en.toLowerCase();
      if(ko&&ko===q)s+=150;else if(ko&&toks.every(t=>ko.includes(t)))s+=100;
      if(kw&&toks.every(t=>kw.includes(t)))s+=80;
      if(toks.every(t=>en.includes(t)))s+=40+(new RegExp('\\b'+toks[0].replace(/[^a-z0-9]/g,'')).test(en)?15:0);
      if(s){s+=h.lvl===4?6:h.lvl===6?3:0;out.push({h,s})}});
  }
  return out.sort((a,b)=>b.s-a.s||a.h.code.length-b.h.code.length||a.h.code.localeCompare(b.h.code)).slice(0,40).map(x=>x.h);
}

async function aiPolish(mode){
  const ta=$('#mail');if(!ta||S.aiBusy)return;const orig=ta.value;const m=AI_MODES().find(x=>x[0]===mode);

    if(st)st.innerHTML=S.aiWarn?`<span class="note" style="display:inline-block">${esc(S.aiWarn)}</span>`:T('AI가 다듬은 문장입니다. 숫자는 원문과 같습니다. 보내기 전에 한 번 읽어 보세요.','Polished by AI. Numbers match the original. Read it once before sending.');

/* ================= charts ================= */
function ticks(min,max,cnt=4){if(!isFinite(min)||!isFinite(max))return[0,1];if(min===max){max=min+1;min=Math.max(0,min-1)}
  const span=max-min,step0=span/cnt,mag=Math.pow(10,Math.floor(Math.log10(step0))),r=step0/mag,step=(r<1.5?1:r<3?2:r<7?5:10)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(10));return out}
const charts={};
function chartSlot(id,h,label){return `<div class="chart" id="ch-${id}" style="height:${h}px" role="img" aria-label="${esc(label||'chart')}"></div>`}
function lineChart(w,o){
  const h=o.h,padL=62,padR=o.bars?62:18,padT=14,padB=30,W=Math.max(200,w),iw=W-padL-padR,ih=h-padT-padB;
  const L=o.labels.length,bw=o.bars?Math.max(3,Math.min(28,iw/Math.max(1,L)*.6)):0,ins=o.bars?bw/2+6:6,xs=i=>padL+ins+(L<=1?(iw-2*ins)/2:i*((iw-2*ins)/(L-1)));
  let ymin=Infinity,ymax=-Infinity;o.series.forEach(s=>s.vals.forEach(v=>{if(isNum(v)){ymin=Math.min(ymin,v);ymax=Math.max(ymax,v)}}));
  if(o.refLine&&isNum(o.refLine.v)){ymin=Math.min(ymin,o.refLine.v);ymax=Math.max(ymax,o.refLine.v)}
  if(!isFinite(ymin)){ymin=0;ymax=1}const pad=(ymax-ymin)*.12||Math.abs(ymax)*.1||1;const yt=ticks(Math.max(0,ymin-pad),ymax+pad,4);
  const y0=yt[0],y1=yt[yt.length-1],ys=v=>padT+ih-(v-y0)/((y1-y0)||1)*ih;
  let s=`<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">`;
  yt.forEach(t=>{s+=`<line x1="${padL}" x2="${W-padR}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-8}" y="${ys(t)+4}" text-anchor="end">${o.yFmt?o.yFmt(t):t}</text>`});
  if(o.bars){const bv=o.bars.vals,bmax=Math.max(...bv.filter(isNum),1),bt=ticks(0,bmax,3),b1=bt[bt.length-1]||1;
    bt.forEach(t=>{const y=padT+ih-t/b1*ih;s+=`<text x="${W-padR+8}" y="${y+4}">${o.bars.fmt(t)}</text>`});
    bv.forEach((v,i)=>{if(!isNum(v)||v<=0)return;const bh=v/b1*ih;s+=`<rect x="${xs(i)-bw/2}" y="${padT+ih-bh}" width="${bw}" height="${bh}" rx="3" fill="var(--vol)"/>`});}
  const every=Math.max(1,Math.ceil(L/(W<520?4:8)));
  o.labels.forEach((l,i)=>{if(i%every===0||i===L-1)s+=`<text x="${xs(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`});
  if(o.refLine&&isNum(o.refLine.v)){const y=ys(o.refLine.v);s+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" stroke="var(--c2)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-padR-4}" y="${y-7}" text-anchor="end" style="fill:var(--c2);font-weight:500">${esc(o.refLine.label)}</text>`}
  o.series.forEach(se=>{let d='',pen=false;se.vals.forEach((v,i)=>{if(isNum(v)){d+=(pen?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1);pen=true}else pen=false});
    if(se.area){const pts=se.vals.map((v,i)=>isNum(v)?[xs(i),ys(v)]:null).filter(Boolean);if(pts.length>1)s+=`<path d="M${pts[0][0]} ${padT+ih}L${pts.map(p=>p.join(' ')).join('L')}L${pts[pts.length-1][0]} ${padT+ih}Z" fill="${se.color}" fill-opacity=".1"/>`}
    if(d)s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width||2.5}" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="6 5"':''}/>`;
    const idx=se.vals.map((v,i)=>isNum(v)?i:-1).filter(i=>i>=0);
    if(idx.length===1)s+=`<circle cx="${xs(idx[0])}" cy="${ys(se.vals[idx[0]])}" r="4.5" fill="${se.color}"/>`;
    const li=idx.pop();if(li!=null&&!se.dash)s+=`<circle cx="${xs(li)}" cy="${ys(se.vals[li])}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`});
  s+=`<line class="hv" x1="0" x2="0" y1="${padT}" y2="${padT+ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/></svg>`;
  return {svg:s,xs,L};
}
function drawCharts(){
  Object.entries(charts).forEach(([id,fn])=>{const el=$('#ch-'+id);if(!el)return;const w=el.clientWidth;const r=fn(w);el.innerHTML=r.svg+'<div class="tip" hidden></div>';
    if(r.tip){const tip=el.querySelector('.tip'),hv=el.querySelector('.hv');
      const move=e=>{const b=el.getBoundingClientRect(),x=e.clientX-b.left;let i=0,best=Infinity;for(let k=0;k<r.L;k++){const dd=Math.abs(r.xs(k)-x);if(dd<best){best=dd;i=k}}
        const html=r.tip(i);if(!html){tip.hidden=true;return}tip.innerHTML=html;tip.hidden=false;const xx=r.xs(i);hv.setAttribute('x1',xx);hv.setAttribute('x2',xx);hv.setAttribute('visibility','visible');
        const tw=tip.offsetWidth;tip.style.left=clamp(xx+12,0,Math.max(0,b.width-tw))+'px';tip.style.top='8px'};
      el.onpointermove=move;el.onpointerdown=move;el.onpointerleave=()=>{tip.hidden=true;hv.setAttribute('visibility','hidden')}}});
}

function walkthrough(){
  const saveM=S.measure;S.measure='kg';const c=ctx('M',12,S.sample.recs.filter(r=>r.hs==='2941'));S.measure=saveM;
  const o=Object.assign({},COP_DEF,{price:'58',inc:'FOB',country:'CHN',qty:'5000'});const e=evaluate(c,o,'buy');if(!e)return '';const R=e.R;
  return `<ol class="walk">
   <li><div><h3>${T('견적이 도착합니다','A quote arrives')}</h3><p>${T('중국 공급사가 항생제 원료(HS 2941) 5,000kg에 <b>USD 58.00/kg, FOB</b> 견적을 보냈습니다. 지난번 거래가보다 비싼 것 같지만 근거가 없습니다.','A Chinese supplier quotes <b>USD 58.00/kg FOB</b> for 5,000 kg of antibiotics (HS 2941). It feels expensive, but you have no evidence.')}</p></div></li>
   <li><div><h3>${T('통계 기준으로 맞춥니다','Align to the statistics basis')}</h3><p>${T(`한국 수입 통계는 CIF 기준이라 FOB 견적에 운임 ${(R.fr*100).toFixed(0)}%와 보험료(110% 부보, 요율 ${(R.ins*100).toFixed(1)}%)를 더해 비교합니다.`,`Korean import statistics are CIF, so freight ${(R.fr*100).toFixed(0)}% and insurance ${(R.ins*100).toFixed(1)}% are added to the FOB quote.`)}</p>
     <div class="out"><span>${T('CIF 환산','CIF equivalent')} <b>${fUSD(e.norm)}/kg</b></span><span>${T('시장 평균','Market average')} <b>${fUSD(c.avg)}/kg</b></span><span>${T('중국산 평균','China average')} <b>${fUSD(e.pc?e.pc.u:NaN)}/kg</b></span></div></div></li>
   <li><div><h3>${T('판정을 받습니다','Get the verdict')}</h3><p>${T(`시장 물량의 ${Math.round(e.rank*100)}%가 이 가격 이하에서 거래됐습니다. 판정은 <b>${e.short}</b>입니다. ${e.verdict}`,`${Math.round(e.rank*100)}% of market volume traded at or below this price. Verdict: <b>${e.short}</b>. ${e.verdict}`)}</p>
     <div class="out"><span>${T('중앙값 대비','vs median')} <b>${fPct(e.diff)}</b></span><span>${T('중국산 대비','vs China')} <b>${fPct(e.pcDiff)}</b></span></div></div></li>
   <li><div><h3>${T('다시 제안할 가격을 정합니다','Set your counter-offer')}</h3><p>${T('1차 제시가는 시장 하위 25%, 목표가는 중앙값, 상한선은 상위 25% 가격입니다. 모두 원래 견적 조건인 FOB로 다시 바꿔 줍니다.','Opening at the 25th percentile, target at the median, ceiling at the 75th percentile, all converted back to FOB.')}</p>
     <div class="out"><span>${T('1차','Opening')} <b>${fmtCur(toOffer(e.T.open,o,R,'CIF'),o,c)}</b></span><span>${T('목표','Target')} <b>${fmtCur(toOffer(e.T.goal,o,R,'CIF'),o,c)}</b></span><span>${T('상한','Ceiling')} <b>${fmtCur(toOffer(e.T.walk,o,R,'CIF'),o,c)}</b></span>${isNum(e.impact)&&e.impact>0?`<span>${T('목표가 합의 시 절감','Saving at target')} <b>${fUSD(e.impact)}</b></span>`:''}</div></div></li>
   <li><div><h3>${T('회신 메일과 보고 메모를 복사합니다','Copy the reply and memo')}</h3><p>${T('통계 근거와 제안 가격이 들어간 영문 메일 초안과 보고용 메모가 만들어집니다. AI로 어조를 다듬을 수 있고, [대괄호]만 채워 보내면 됩니다.','An English reply with the evidence and a memo are generated. Polish the tone with AI and fill the [brackets].')}</p></div></li>
  </ol>`;
}

      <div class="eyebrow">${T('데이터와 계산','Data and method')}</div>
      <h2 style="margin-top:10px">${T('숫자는 공식 통계에서,<br>문장은 정해진 규칙에서','Numbers from official statistics,<br>words from fixed rules')}</h2>
      <p class="sub">${T('UN Comtrade는 각국 통계당국이 (주로 세관 자료로) 보고한 품목별·상대국별 수출입 금액과 중량을 모은 유엔 공식 데이터베이스입니다. 단가는 신고 금액을 중량(또는 수량)으로 나눈 값이며, 국가·월별 단가를 물량으로 가중해 계산하므로 소량 거래 한 건이 평균을 흔들지 않습니다. 협상 문구와 메일은 계산 결과에 따라 정해진 규칙으로 만들고, AI는 원하는 경우에만 문장을 다듬습니다.','UN Comtrade is the UN\'s official database of trade values and weights reported by customs authorities. Unit price is declared value divided by weight (or quantity), weighted by volume so one small shipment cannot skew the average. Talking points and emails follow fixed rules; AI only rewords on request.')}</p>
      <div class="row" style="margin-top:20px"><span class="tag t-neutral">UN Comtrade</span><span class="tag t-neutral">${T('관세청 수출입무역통계','Korea Customs statistics')}</span><span class="tag t-neutral">${T('CSV 직접 업로드','CSV upload')}</span></div>

const glossary=()=>[['HS',T('HS 코드','HS code'),T('국제 공통 품목 분류 번호입니다. 2자리 류, 4자리 호, 6자리 소호로 세분하며 6자리까지 전 세계가 같습니다. 원료의약품은 주로 29류, 완제·바이오의약품은 30류입니다. 단, 항체 원액 같은 바이오 원료는 3002.13·14, 헤파린 등은 3001에 분류됩니다.','The international product classification: 2-digit chapter, 4-digit heading, 6-digit subheading, identical worldwide to 6 digits. APIs are mostly in chapter 29, finished and biological medicines in chapter 30.')],
  ['EXW',T('공장인도','Ex works'),T('판매자 공장에서 넘깁니다. 수출 통관과 운송비 전부를 사는 쪽이 부담합니다. 항공 운송 의약품은 수출지 비용이 기본값 0.5%보다 클 수 있으니 실제 견적으로 바꾸세요.','Handed over at the seller\'s premises; the buyer handles export clearance and all transport. Origin costs for air-freighted medicines can be well above the 0.5% default, so use real quotes.')],
  ['FCA',T('운송인인도','Free carrier'),T('지정 장소에서 사는 쪽이 지정한 운송인에게 넘깁니다. 항공·컨테이너 운송의 표준 조건이며 이 도구는 FOB와 같게 봅니다.','Delivered to the buyer\'s carrier at a named place. Standard for air and container shipments; treated like FOB here.')],
  ['FAS',T('선측인도','Free alongside ship'),T('수출항 본선 옆까지 넘깁니다. 해상 전용이며 이 도구는 FOB와 같게 봅니다.','Alongside the vessel at the port of shipment; sea only, treated like FOB here.')],
  ['FOB',T('본선인도','Free on board'),T('수출항에서 본선에 실을 때까지의 비용을 포함합니다. 해상·내수로 전용이며 대부분 국가의 수출 통계 기준입니다.','Up to loading on board at the export port. Sea and inland waterway only; the basis of most export statistics.')],
  ['CPT',T('운송비 지급','Carriage paid to'),T('지정 목적지까지 운송비를 판매자가 내지만 위험은 첫 운송인에게 넘길 때 이전됩니다. 항공 운송에서 CFR 대신 씁니다.','Seller pays carriage to the destination, risk passes at handover to the first carrier. Used instead of CFR for air.')],
  ['CFR',T('운임 포함','Cost and freight'),T('FOB에 해상운임을 더한 가격입니다. 위험은 수출항 선적 때 넘어가고 보험은 사는 쪽이 듭니다.','FOB plus sea freight. Risk passes on loading; the buyer insures.')],
  ['CIP',T('운송비·보험료 지급','Carriage and insurance paid'),T('CPT에 보험을 더한 조건으로, 계약금액의 110%를 ICC(A) 수준으로 부보해야 합니다. 항공 운송 의약품에 많이 씁니다.','CPT plus insurance of 110% of the value at ICC(A) level. Common for air-freighted medicines.')],
  ['CIF',T('운임·보험료 포함','Cost, insurance, freight'),T('CFR에 보험을 더한 가격으로 최소 ICC(C), 110% 부보입니다. 위험은 수출항 선적 때 넘어갑니다. 대부분 국가의 수입 통계 기준입니다.','CFR plus insurance (at least ICC(C), 110% cover). Risk passes on loading. The basis of most import statistics.')],
  ['DAP',T('도착지인도','Delivered at place'),T('수입국 지정 장소까지 운송과 위험을 판매자가 집니다. 수입 통관·관세는 사는 쪽입니다. 이 도구는 CIF에 도착지 비용 %를 더해 봅니다.','Seller bears transport and risk to a named place in the destination; the buyer clears imports. Treated as CIF plus destination costs %.')],
  ['DPU',T('도착지양하인도','Delivered at place unloaded'),T('DAP와 같되 양하까지 판매자가 합니다. 이 도구는 DAP와 같게 봅니다.','Like DAP but unloaded by the seller; treated like DAP here.')],
  ['DDP',T('관세지급인도','Delivered duty paid'),T('수입 통관과 관세까지 판매자가 부담합니다. 이 도구는 DAP에 CIF 과세가격 × 관세율을 더하고 부가세는 뺍니다.','Seller also clears imports and pays duty. Treated as DAP plus duty % of the CIF value, excluding VAT.')],
  ['API',T('원료의약품','Active pharmaceutical ingredient'),T('약효를 내는 원료 물질입니다. 대부분 29류(유기화학품)에 분류되며 등급·순도·제조소 인증에 따라 값 차이가 큽니다.','The active substance. Mostly classified in chapter 29; price varies widely with grade, purity and site approval.')],
  ['GMP',T('의약품 제조품질관리기준','Good Manufacturing Practice'),T('의약품 제조소가 지켜야 하는 품질 기준입니다. 어느 당국의 GMP 근거가 있는지(EU·PIC/S 회원 당국 인증서, 미국 FDA 실사 결과, WHO 사전적격성평가, 식약처)에 따라 공급할 수 있는 시장이 달라집니다.','Quality rules for manufacturing sites. Which authority\'s GMP evidence a site holds (EU or PIC/S-member certificate, FDA inspection status, WHO PQ, MFDS) decides which markets it can serve.')],
  ['PIC/S',T('의약품실사상호협력기구','Pharmaceutical Inspection Co-operation Scheme'),T('각국 GMP 실사 당국이 실사 기준을 맞추는 국제 협력기구입니다. 한국은 2014년에 가입했습니다. 회원국 실사는 서로 신뢰도가 높은 편이지만, 가입이 곧 자동 상호인정을 뜻하지는 않습니다.','International co-operation of GMP inspectorates (Korea joined in 2014). Membership signals harmonised inspections but is not automatic mutual recognition.')],
  ['WLA',T('WHO 공인 규제기관','WHO-Listed Authority'),T('WHO가 국제 기준을 충족한다고 공인한 규제기관입니다. 성숙도 평가(ML3·ML4)와 함께 그 나라 규제 체계를 가늠하는 지표로 씁니다.','A regulator recognised by WHO as meeting international standards; used with maturity levels (ML3/ML4) to gauge a regulatory system.')],
  ['DMF',T('원료의약품 등록 자료','DMF / ASMF / CEP'),T('원료의 제조·품질 정보를 규제기관에 제출하는 자료입니다. 미국은 DMF, 유럽은 ASMF 또는 EDQM의 CEP(적합성 인증서), 한국은 식약처 원료의약품 등록(DMF)을 씁니다. 공급처를 바꾸면 허가 변경이 필요해 보통 6~18개월이 걸립니다.','API manufacturing and quality data filed with regulators: a DMF in the US, an ASMF or an EDQM CEP in Europe, an MFDS DMF registration in Korea. Changing source needs a variation, usually 6–18 months.')],
  ['CoA',T('시험성적서','Certificate of analysis'),T('배치별 규격 시험 결과입니다. 견적을 비교할 때는 같은 규격(약전)의 CoA인지 확인합니다.','Batch test results against the specification. Make sure quotes refer to the same pharmacopoeia.')],
  ['TP',T('이전가격','Transfer price'),T('같은 기업 집단 안의 본사-지사 거래 가격입니다. 의약품 수입 통계에 많이 섞여 있어 독립 거래가와 다를 수 있습니다.','Price between related companies. Common in medicine imports; can differ from arm\'s-length prices.')],
  ['AVG',T('가중평균 단가','Weighted average'),T('금액 합을 중량 합으로 나눈 값으로, 물량이 큰 거래가 더 크게 반영됩니다.','Total value divided by total weight; large shipments count more.')],
  ['P25',T('하위 25% 가격','25th percentile'),T('시장 물량의 25%가 이 가격 이하에서 거래됐다는 뜻입니다. 구매 협상의 1차 제시가로 씁니다.','25% of volume traded at or below this price. Used as the buyer\'s opening offer.')],
  ['P50',T('중앙값','Median'),T('물량 기준으로 가운데 가격입니다. 협상 목표가로 씁니다.','The volume-weighted middle price, used as the target.')],
  ['P90/10',T('가격 폭','Price spread'),T('P90을 P10으로 나눈 값입니다. 3배를 넘으면 한 코드에 다른 제품이 섞였을 가능성이 커서 비교 신뢰도를 낮춥니다.','P90 divided by P10. Above 3× suggests different products under one code and lowers reliability.')],
  ['HHI',T('허핀달 지수','Herfindahl index'),T('국가별 점유율 제곱의 합 × 10,000입니다. 미국 법무부·FTC 2023년 기준으로 1,800을 넘으면 고집중, 1,000~1,800은 중간입니다.','Sum of squared shares × 10,000. Under the 2023 US DOJ/FTC guidelines, above 1,800 is highly concentrated and 1,000–1,800 moderate.')],
  ['CV',T('변동계수','Coefficient of variation'),T('표준편차 ÷ 평균입니다. 12%를 넘으면 가격이 크게 출렁이는 편입니다.','Standard deviation ÷ mean. Above 12% means volatile prices.')],
  ['UNC','UN Comtrade',T('각국이 유엔에 보고한 공식 무역통계 데이터베이스입니다. 보고국과 상대국이 집계한 값이 서로 다를 수 있습니다.','The UN database of official trade statistics. Reporter and partner figures can differ.')]];
const faq=()=>[[T('표시되는 단가는 실제 계약 가격인가요?','Is the unit price a contract price?'),T('아닙니다. 세관 신고 금액을 중량(또는 수량)으로 나눈 평균 단가입니다. 실제 계약가는 수량, 인코텀즈, 품질 등급, 결제 조건에 따라 달라지므로 협상의 기준점으로 쓰세요.','No. It is declared value divided by weight (or quantity). Contract prices depend on volume, terms, grade and payment, so use it as a benchmark.')],
  [T('어떤 품목과 나라를 볼 수 있나요?','Which products and countries?'),T('의약품과 그 원료에 해당하는 HS 2022 6자리 소호 470여 개(류·호 포함 520여 개, 29류 유기화학품·원료의약품, 30류 의약품, 1302 생약 추출물, 3507 효소, 3822 진단시약)와, UN Comtrade에 자료를 보고하는 200여 개 나라를 고를 수 있습니다. 화장품·기계류 등 의약품이 아닌 품목은 다루지 않습니다. 품목명이 한글로 등록되지 않은 코드는 영문 공식 명칭으로 보여줍니다.','About 470 six-digit HS 2022 subheadings (520+ with chapters and headings) for medicines and their raw materials (chapter 29 APIs, chapter 30 medicines, 1302 plant extracts, 3507 enzymes, 3822 diagnostic reagents) and the 200+ countries reporting to UN Comtrade. Non-pharma goods such as cosmetics or machinery are out of scope. Codes without a Korean name show the official English name.')],
  [T('지금 화면의 숫자는 진짜인가요?','Are these numbers real?'),T('배포 버전에서는 UN Comtrade에서 실시간으로 불러온 공식 통계입니다. claude.ai 미리보기에서는 보안 정책 때문에 외부 데이터에 접속할 수 없어 예시 데이터나 직접 올린 CSV로 계산합니다. 화면 오른쪽 위 표시로 어떤 데이터인지 항상 확인할 수 있습니다.','On the deployed site, yes: live UN Comtrade statistics. In the claude.ai preview, outside data is blocked, so it uses sample data or your CSV. The badge at the top right always shows which.')],
  [T('데이터는 얼마나 최신인가요?','How current is the data?'),T('나라마다 다릅니다. 한국은 월간 자료가 두세 달 뒤에 올라오는 편이고, 월간 자료가 없는 나라는 연간 자료로 자동 전환합니다.','It varies. Korea\'s monthly data usually appears within two or three months; countries without monthly data switch to annual automatically.')],
  [T('kg당 단가가 의미 없는 품목은요?','What if price per kg is meaningless?'),T('완제의약품이나 백신처럼 kg보다 개수·도즈가 맞는 품목은 UN Comtrade의 보조 수량 단위가 있으면 그 단위로 단가를 계산하고, 협상 코파일럿에서는 판매단위(도즈·팩)로 환산할 수 있습니다. 상단에서 kg과 수량 단위를 바꿀 수 있습니다.','For finished medicines or vaccines, unit price uses the supplementary quantity unit when reported, and the copilot converts to sales units (doses or packs). Switch between kg and units at the top.')],
  [T('의약품도 정확히 비교되나요?','Does it work for medicines?'),T('원료의약품(29류)은 6자리 코드 안에서도 성분·등급이 섞이고, 완제·바이오의약품(30류)은 kg당 단가에 제품·함량·포장 차이가 섞입니다. 그래서 화면마다 비교 신뢰도(높음·보통·낮음)와 그 사유를 보여주고, 30류는 kg당 도즈·팩 수를 넣어 도즈당 가격으로도 비교할 수 있게 했습니다. 등급, GMP, DMF·CEP, 유효기간, 콜드체인은 가격 외 확인 항목으로 따로 챙깁니다.','APIs (chapter 29) pool different substances and grades even at 6 digits, and per-kg values for finished and biological medicines (chapter 30) mix products, strengths and packaging. So every view shows a reliability level with reasons, chapter 30 supports per-dose comparison, and grade, GMP, DMF/CEP, shelf life and cold chain are tracked as non-price checks.')],
  [T('AI가 숫자를 만들어 내지는 않나요?','Does AI invent numbers?'),T('숫자는 모두 통계에서 계산합니다. AI는 원할 때 메일 문장만 다듬고, 다듬은 결과의 숫자가 원문과 다르면 경고합니다.','All numbers come from statistics. AI only rewords the email on request, and the app warns if any number changed.')]];

const VIEWS=()=>[['dash',T('대시보드','Dashboard'),'dash'],['countries',T('국가별 단가','Countries'),'flag'],['trend',T('추이 분석','Trends'),'trend'],['routes',T('교역 루트맵','Route map'),'route'],['_',T('협상 도구','Negotiation')],['copilot',T('협상 코파일럿','Copilot'),'deal'],['quotes',T('견적 비교','Quotes'),'quotes'],['margin',T('수출 마진 계산기','Export margin'),'calc'],['history',T('협상 기록','History'),'hist'],['_',T('업계 정보','Industry')],['rivals',T('경쟁사·제조소','Competitors'),'users'],['regs',T('국가별 규제','Regulators'),'shield'],['_',T('데이터','Data')],['data',T('데이터 관리','Data sources'),'data'],['method',T('계산 방법·용어','Method & terms'),'book']];
const FAV=[410,156,392,842,704,276,699,764,360,458,608,826,251,380,724,528,56,757,372,76,484,792,682,784,36,124,643,490];
function reporterSelect(){
  const favs=FAV.map(c=>REF.byCode[c]).filter(Boolean),favSet=new Set(FAV);
  const nm=c=>S.lang==='en'?c.en:c.ko;
  const rest=REF.ctry.filter(c=>!favSet.has(c.c)).sort((a,b)=>nm(a).localeCompare(nm(b),S.lang==='en'?'en':'ko'));
  const op=c=>`<option value="${c.c}" ${+S.reporter===c.c?'selected':''}>${esc(nm(c))}</option>`;
  return `<label class="sr" for="f-rep">${T('보고국','Reporter')}</label><select id="f-rep" class="select" title="${T('보고국: 이 나라 세관이 보고한 수출입 통계를 씁니다','Reporter: the country whose customs data is used')}"><optgroup label="${T('주요 국가','Main')}">${favs.map(op).join('')}</optgroup><optgroup label="${T('전체','All')}">${rest.map(op).join('')}</optgroup></select>`;
}
function productPicker(){
  const h=hsInfo(S.hs);
  if(!S.pOpen)return `<div class="psearch"><button type="button" class="psel" data-popen aria-label="${T('품목 바꾸기','Change product')}" title="${esc(h?h.en:'')}">${ico('search',16)}<span class="code">HS ${S.hs}</span><span class="nm">${esc(prodName(S.hs))}</span></button></div>`;
  const sugg=['2941','294190','292429','294110','293627','300490','300215','300241','300290','3822'].filter(c=>REF.hsMap[c]).map(c=>REF.hsMap[c]);
  const res=S.pq.trim()?hsSearch(S.pq):sugg;
  const row=(x,i)=>{const kc=hsKoCtx(x.code);return `<button type="button" role="option" data-pick="${x.code}" class="${i===S.pAct?'act':''}" aria-selected="${i===S.pAct}"><span><span class="code">${x.code}</span><span class="lv">${x.lvl===2?T('류','chapter'):x.lvl===4?T('호','heading'):T('소호','subheading')}</span></span><span>${S.lang==='ko'?`<span class="ko">${esc(x.ko||(kc?kc.ko+' 중':''))}</span>`:''}<span class="en">${esc(x.en)}</span></span></button>`};
  return `<div class="psearch"><span class="ic">${ico('search',18)}</span><label class="sr" for="p-q">${T('품목 검색','Search products')}</label><input id="p-q" class="input" autocomplete="off" placeholder="${T('성분·품목명·HS 코드 (예: 항생제, 파라세타몰, 2941, vaccine)','Ingredient, product or HS code (e.g. antibiotics, paracetamol, 2941)')}" value="${esc(S.pq)}" role="combobox" aria-expanded="true" aria-controls="p-list">
    <div class="pdrop" id="p-list" role="listbox">${!S.pq.trim()?`<div class="none">${T('자주 찾는 품목 · 6자리 코드가 가장 정확합니다','Popular products · 6-digit codes are most precise')}</div>`:''}${res.length?res.map(row).join(''):`<div class="none">${hsSearch(S.pq,true).length?T('의약품·원료가 아닌 품목입니다. 이 사이트는 의약품과 그 원료(29·30류, 생약 추출물, 효소, 진단시약)만 다룹니다.','This is not a pharmaceutical product. The site covers medicines and their raw materials only (chapters 29–30, plant extracts, enzymes, diagnostic reagents).'):T('검색 결과가 없습니다. 성분명, HS 코드 숫자, 영문 품명으로도 찾아보세요.','No results. Try an ingredient, HS code or English name.')}</div>`}</div></div>`;
}
function appHTML(){
  const c=ctx();
  const nav=VIEWS().map(v=>v[0]==='_'?`<div class="navsec">${v[1]}</div>`:`<button type="button" data-view="${v[0]}" ${S.view===v[0]?'aria-current="page"':''}>${ico(v[2],18)}${v[1]}${v[0]==='history'&&S.hist.length?`<span class="cnt">${S.hist.length}</span>`:''}</button>`).join('');
  const views={dash:vDash,countries:vCountries,trend:vTrend,routes:vRoutes,copilot:vCopilot,quotes:vQuotes,margin:vMargin,history:vHistory,rivals:vRivals,regs:vRegs,data:vData,method:vMethod};
  const showFilters=!['history','method'].includes(S.view);
  const flowLock=S.view==='margin';
  const di=dsInfo();
  const perOpts=(S.src==='live'&&S.freq==='A'?[[5,T('최근 5년','Last 5 years')],[3,T('최근 3년','Last 3 years')]]:[[6,T('최근 6개 기간','Last 6 periods')],[12,T('최근 12개 기간','Last 12 periods')],[24,T('최근 24개 기간','Last 24 periods')]]).map(([k,l])=>`<option value="${k}" ${S.n===k?'selected':''}>${l}</option>`).join('');
  const hasQty=!!c.qu||S.measure==='qty';
  return `<div class="shell">
  <aside class="side">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="logo" data-go="intro" aria-label="PharmaPrice Lens">${LOGO}PharmaPrice Lens</button></div>
    <nav class="nav" aria-label="${T('앱 메뉴','App menu')}">${nav}</nav>
    <div class="side-foot">
      ${langBtn()}
      <div class="small"><b>${esc(S.user?S.user.name:'')}</b><div class="muted" style="font-size:13px;overflow:hidden;text-overflow:ellipsis">${esc(S.user?S.user.email:'')}</div></div>
      <button type="button" class="btn btn-sm" data-logout>${ico('out',16)}${T('로그아웃','Log out')}</button>
    </div>
  </aside>
  <div class="main">
    <div class="bar"><div class="bar-in">
      ${showFilters?`${productPicker()}${S.src==='live'?reporterSelect():''}
      ${flowLock?`<span class="tag t-neutral">${T('수출 (FOB) 기준','Exports (FOB)')}</span>`:`<div class="seg" role="group" aria-label="${T('거래 방향','Flow')}"><button type="button" data-flow="M" aria-pressed="${S.flow==='M'}">${T('수입','Imports')}</button><button type="button" data-flow="X" aria-pressed="${S.flow==='X'}">${T('수출','Exports')}</button></div>`}
      ${S.src==='live'?`<div class="seg" role="group" aria-label="${T('주기','Frequency')}"><button type="button" data-freq="M" aria-pressed="${S.freq==='M'}">${T('월간','Monthly')}</button><button type="button" data-freq="A" aria-pressed="${S.freq==='A'}">${T('연간','Annual')}</button></div>`:''}
      <label class="sr" for="f-n">${T('기간','Period')}</label><select id="f-n" class="select">${perOpts}</select>
      ${motAvail()||(S.mot&&S.mot!=='0')?`<label class="sr" for="f-mot">${T('운송 수단','Transport mode')}</label><select id="f-mot" class="select">${[['0',T('운송 전체','All modes')],['1000',T('항공','Air')],['2100',T('해상','Sea')],['3000',T('육상','Land')],['9200',T('우편·특송','Post/courier')]].map(([v,l])=>`<option value="${v}" ${String(S.mot||'0')===v?'selected':''}>${l}</option>`).join('')}</select>`:''}
      ${hasQty?`<div class="seg" role="group" aria-label="${T('단가 기준','Price per')}"><button type="button" data-measure="kg" aria-pressed="${c.measure==='kg'}">${T('kg당','per kg')}</button><button type="button" data-measure="qty" aria-pressed="${c.measure==='qty'}">${esc(quLabel(c.qu))}${T('당','')}</button></div>`:''}`:''}
      <span class="sp"></span>
      <button type="button" class="dsbadge ${di.kind}" data-view="data" title="${T('데이터 관리로 이동','Go to data sources')}"><i></i>${esc(di.label)}${di.detail&&showFilters&&di.kind==='live'?` · ${esc(di.detail)}`:''}</button>
      <button type="button" class="btn btn-sm lo-m" data-logout>${T('로그아웃','Log out')}</button>

}
function liveBanner(){
  if(S.src!=='live'||!S.live||S.view==='data'||S.view==='method'||S.view==='history')return '';
  const L=S.live;
  if(L.status==='loading')return `<div class="card fade" aria-live="polite"><div class="row" style="justify-content:space-between"><b>${T(`UN Comtrade에서 ${repName()}의 HS ${S.hs} 자료를 불러오는 중입니다`,`Loading HS ${S.hs} data reported by ${repName()} from UN Comtrade`)}</b><span class="mono small" id="live-prog-t">${L.done} / ${L.total}</span></div><div class="prog" style="margin-top:12px"><i id="live-prog" style="width:${L.done/L.total*100}%"></i></div><p class="hint" style="margin-top:8px">${T('기간마다 한 번씩 요청합니다. 처음 한 번만 기다리면 24시간 동안 저장해 둡니다.','One request per period. Results are cached for 24 hours.')}</p></div>`;
  if(L.status==='error')return `<div class="confirm" role="alert">${T('UN Comtrade에 연결하지 못했습니다. 잠시 후 다시 시도하세요. 요청이 몰리면 일시적으로 막힐 수 있습니다.','Could not reach UN Comtrade. Try again shortly; heavy traffic can cause temporary blocks.')} <button class="btn btn-sm" data-reload>${ico('refresh',16)}${T('다시 불러오기','Retry')}</button></div>`;

}

const PERM={st:'idle'};
async function loadPermits(){
  if(PERM.st!=='idle')return;PERM.st='loading';
  try{const r=await fetchT('data/permits.json',{},45000);if(!r.ok)throw new Error(r.status);const j=await r.json();
    PERM.comp=j.comp;PERM.mat=j.mat;PERM.rows=j.rows;PERM.asof=j.asof;PERM.total=j.total;PERM.src=j.src;PERM.st='ok';
  }catch(e){PERM.st='error'}
  if(S.view==='rivals')render();
}
// English ingredient for a Korean DMF name (built from product names that mention it).
const ingEn=k=>(DMF.en&&DMF.en[k])||'';
const PERM_OK_EXTRA=/^(coated|powder|granules?|micro\w*|encapsulated|dc|d|c|\d+(\.\d+)?%?|mixture|premix|spray|dried|fine|direct|directly|compressible|compression|for|grade|form|crystals?|beads?|pellets?|solution|concentrate|ep|usp|bp|jp|kp)$/;
function permRows(ing){
  const E=ingEn(ing);if(!E||PERM.st!=='ok')return null;
  PERM.cache=PERM.cache||{};if(PERM.cache[ing])return PERM.cache[ing];
  const hit={};PERM.mat.forEach((m,i)=>{if(m===E){hit[i]=1;return}if(E.length>=6&&(' '+m+' ').includes(' '+E+' ')){const extra=(' '+m+' ').replace(' '+E+' ',' ').trim().split(' ').filter(Boolean);if(extra.every(w=>PERM_OK_EXTRA.test(w)))hit[i]=1}});
  return PERM.cache[ing]=PERM.rows.filter(r=>r[2].some(x=>hit[x])).map(r=>({nm:r[0],co:PERM.comp[r[1]],mats:r[2].length,yr:r[3],etc:r[4]===1,st:r[5],kind:r[6],biz:r[7]}));
}

      <div class="grid2"><div><div class="hint">${T('품목','Product')}</div><b>HS ${esc(S.hs)}</b> <span class="small">${esc(prodName(S.hs))}</span></div><div><div class="hint">${T('보고국','Reporter')}</div><b>${esc(repName())}</b></div>

      ${S.src==='csv'&&S.csv?(()=>{const cnt={};S.csv.recs.forEach(r=>cnt[r.hs]=(cnt[r.hs]||0)+1);const L=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,16);return L.length>1?`<div style="margin-top:14px"><div class="hint">${T('CSV에 들어 있는 품목 (눌러서 바꾸기)','Products in the CSV (click to switch)')}</div><div class="chips" style="margin-top:6px">${L.map(([h])=>`<button type="button" class="chipbtn" data-pick="${esc(h)}" aria-pressed="${S.hs===h}">${esc(h)} ${esc(shortEn(prodName(h),28))}</button>`).join('')}</div></div>`:''})():''}
      ${recs.length?`<button class="btn btn-sm" style="margin-top:14px" data-dl="dataset">${ico('down',16)}${T('이 데이터 CSV로 내려받기','Download this data as CSV')}</button>`:''}
      ${S.src==='live'?`<button class="btn btn-sm" style="margin-top:14px;margin-left:6px" data-reload>${ico('refresh',16)}${T('새로 불러오기','Reload')}</button>`:''}</div>
    <div class="card"><div class="card-head"><h3>${T('정확도를 높이는 법','Accuracy tips')}</h3></div>
      <ul class="points">
        <li><span class="n">1</span><span>${T('6자리 HS 코드를 쓰세요. 4자리는 성분이 다른 제품이 섞여 단가 폭이 넓어집니다.','Use 6-digit codes; 4-digit headings mix different products.')}</span></li>
        <li><span class="n">+</span><span>${T('한국 수출입이라면 관세청 수출입무역통계(tradedata.go.kr) → 품목별 국가별 수출입실적에서 HSK 10단위 코드로 내려받아 올리세요. 6자리보다 성분 단위에 가깝고 UN Comtrade보다 최신입니다. 품목명 열도 함께 읽습니다.','For Korean trade, download 10-digit HSK data by product and country from Korea Customs (tradedata.go.kr). It is closer to the actual substance than 6-digit codes and more recent than UN Comtrade. The product-name column is read too.')}</span></li>
        <li><span class="n">2</span><span>${T('"소량" 국가는 단가가 튀기 쉬우니 판단에서 무게를 낮추세요.','Give "small" partners less weight; their prices are noisy.')}</span></li>
        <li><span class="n">3</span><span>${T('추정 중량 비중이 높다는 신호가 뜨면 수량 단위 기준으로도 확인하세요.','If estimated weights are flagged, also check per-unit prices.')}</span></li>
        <li><span class="n">4</span><span>${T('의약품은 6자리 코드도 성분·등급이 섞이고, 30류는 kg당 단가에 포장·함량 차이가 섞입니다. 협상 코파일럿의 비교 신뢰도와 판매단위(도즈·팩) 환산을 함께 보세요.','For medicines, even 6-digit codes mix substances and grades, and chapter 30 per-kg values mix packaging and strength. Check the reliability card and the per-dose conversion in the copilot.')}</span></li>
        <li><span class="n">5</span><span>${T('보고국과 상대국 통계는 다를 수 있습니다(미러 데이터). 수출 협상이면 상대국을 보고국으로 놓고 수입 단가도 확인하세요.','Reporter and partner statistics can differ. For export deals, also set the buyer\'s country as reporter and check its import prices.')}</span></li>
      </ul></div>
  </div>
  <div class="card"><div class="card-head"><h3>${T('CSV 불러오기','Upload CSV')}</h3>
    <div class="row"><div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="imp-vu">${T('금액 단위','Value unit')}</label><select id="imp-vu" class="select" style="width:auto;min-height:40px"><option value="auto">${T('자동 판단','Auto')}</option><option value="1">USD</option><option value="1000">${T('천 USD','USD thousand')}</option></select></div>
    <div class="field" style="flex-direction:row;align-items:center;gap:8px"><label for="imp-wu">${T('중량 단위','Weight unit')}</label><select id="imp-wu" class="select" style="width:auto;min-height:40px"><option value="auto">${T('자동 판단','Auto')}</option><option value="1">kg</option><option value="1000">${T('톤','tonnes')}</option></select></div></div></div>
    <div class="drop" id="drop">${ico('up',30)}<b>${T('CSV 파일을 끌어오거나 선택하세요','Drop or choose a CSV file')}</b><span class="small muted">${T('UTF-8·EUC-KR · 쉼표·세미콜론·탭 · 엑셀은 CSV로 저장 후 올려 주세요','UTF-8 or EUC-KR · comma, semicolon or tab · save Excel as CSV first')}</span><label class="btn btn-primary btn-sm" for="imp-file" style="cursor:pointer">${T('파일 선택','Choose file')}</label><input id="imp-file" type="file" accept=".csv,.tsv,.txt,text/csv" hidden></div>
    ${imp?impResult(imp):''}
    <details class="adv" style="margin-top:14px"><summary>${T('직접 만든 CSV 양식','CSV template')}</summary>

      <button class="btn btn-sm" data-copy="tpl" style="margin-top:8px">${ico('copy',16)}${T('양식 복사','Copy template')}</button>
      <p class="hint" style="margin-top:8px">${T('flow는 M/X, 수입/수출, Import/Export를 인식합니다. 관세청 형식(수출금액·수입금액 열)과 UN Comtrade 형식도 그대로 읽습니다.','flow accepts M/X, Import/Export. Korea Customs (separate export/import columns) and UN Comtrade formats are read as-is.')}</p></details>
  </div>`;
}
function impResult(imp){
  if(imp.error)return `<div class="confirm" style="margin-top:14px" role="alert">${esc(imp.error)}</div>`;
  const prev=imp.recs.slice(0,8);const hs=Array.from(new Set(imp.recs.map(r=>r.hs))).sort(),per=Array.from(new Set(imp.recs.map(r=>r.period))).sort();
  return `<div style="margin-top:16px;display:flex;flex-direction:column;gap:12px" class="fade">
    <div class="row"><span class="tag t-good">${imp.recs.length.toLocaleString()} ${T('행 읽음','rows read')}</span>${imp.skipped?`<span class="tag t-warn">${imp.skipped.toLocaleString()} ${T('행 건너뜀','rows skipped')}</span>`:''}<span class="tag t-neutral">HS ${hs.slice(0,6).join(', ')}${hs.length>6?' …':''}</span><span class="tag t-neutral">${pl(per[0])}–${pl(per[per.length-1])}</span><span class="tag t-neutral">${T('금액','value')} ×${imp.vu.toLocaleString()} · ${T('중량','weight')} ×${imp.wu.toLocaleString()}</span></div>
    ${imp.skipped?`<p class="hint">${Object.entries(imp.why).filter(([k,v])=>v).map(([k,v])=>`${k} ${v}`).join(' · ')}</p>`:''}
    <p class="hint">${T('인식한 열','Columns')}: ${Object.entries(imp.map).filter(([k,v])=>v!=null).map(([k,v])=>`${k} = <b>${esc(v)}</b>`).join(' · ')}</p>
    <div class="tbl-wrap"><table class="tbl" style="min-width:600px"><thead><tr><th>${T('기간','Period')}</th><th>${T('상대국','Partner')}</th><th>HS</th><th>${T('구분','Flow')}</th><th class="r">USD</th><th class="r">kg</th><th class="r">${T('단가','Price')}</th></tr></thead><tbody>
    ${prev.map(r=>`<tr><td class="mono">${esc(r.period)}</td><td>${esc(cName(r.p,r.nm))}</td><td class="mono">${esc(r.hs)}</td><td>${r.flow==='M'?T('수입','Imp'):T('수출','Exp')}</td><td class="r mono">${Math.round(r.v).toLocaleString()}</td><td class="r mono">${Math.round(r.kg).toLocaleString()}</td><td class="r mono">${fUSD(r.v/r.kg)}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint">${T('단가가 예상과 1,000배 다르면 금액·중량 단위를 바꾼 뒤 파일을 다시 선택하세요.','If prices look 1,000× off, change the units and choose the file again.')}</p>
    <div class="row"><button class="btn btn-primary" data-apply>${T('이 데이터로 분석하기','Analyse this data')}</button><button class="btn btn-ghost" data-imp-cancel>${T('취소','Cancel')}</button></div></div>`;
}
function vMethod(){
  const items=[[T('단가','Unit price'),T('국가별 평균 단가 = 선택 기간의 신고금액 합 ÷ 순중량(또는 보조 수량) 합. 월별 단가를 단순 평균하지 않아 물량이 큰 달이 더 크게 반영됩니다. 중량이 없는 행은 단가 계산에서 빠집니다.','Average price = total declared value ÷ total net weight (or supplementary quantity). Rows without weight are excluded.')],
    [T('값의 기준','Valuation'),T('UN Comtrade 자료는 수입은 CIF 금액(없으면 FOB), 수출은 FOB 금액을 씁니다. 수입을 FOB로만 보고하는 나라는 자동으로 FOB 기준이 됩니다. 기본은 운송 수단 전체(해상·항공 등 합계)이며, 운송 수단별 자료를 내는 보고국(독일 등)은 상단에서 항공·해상을 고를 수 있습니다.','Imports use the CIF value (FOB if missing), exports FOB. Reporters that only give FOB import values switch to FOB automatically. All modes of transport are combined.')],
    [T('시장 분포','Distribution'),T('국가×기간 단가를 물량으로 가중해 P10·P25·중앙값·P75·P90을 구합니다. 판정의 위치(%)는 제시가 이하에서 거래된 물량 비율입니다.','Partner × period prices weighted by volume give P10–P90. Position (%) is the share of volume at or below the offer.')],
    [T('판정·제안 가격','Verdict & targets'),T('제시가는 시장 중앙값과 비교해 %로 보여줍니다. 의약품 단가는 고가 제품 몇 건이 평균을 끌어올리는 경우가 많아, 평균보다 중앙값이 실제 거래 수준을 더 잘 나타냅니다. 판정은 제시가 이하에서 거래된 물량 비율로 정합니다. 사는 입장: 25% 이하 매우 유리 … 90% 초과 매우 불리. 1차 제시가 P25, 목표 중앙값, 상한 P75. 파는 입장은 반대입니다.','The offer is shown as % versus the market median. For medicines a few high-priced products often pull the average up, so the median reflects typical trades better. The verdict uses the share of volume traded at or below the offer. Buying: ≤25% very favorable … >90% very unfavorable; opening P25, target median, ceiling P75. Selling is reversed.')],
    [T('상대국 통계 교차 확인','Mirror check'),T('국가별 단가에서 나라를 누르거나 협상 코파일럿에서 상대국을 고르면, 같은 거래를 상대국이 신고한 통계와 비교할 수 있습니다. 수입(CIF)과 상대국 수출(FOB)의 단가 비율이 0.9~1.25배면 운임·보험료 차이 범위로 보고 "두 통계가 맞음"으로, 벗어나면 신고 시점·분류·이전가격 차이 가능성을 경고합니다.','Click a country in Countries, or pick a counterpart in the copilot, to compare with the partner\'s own report of the same trade. A CIF/FOB ratio of 0.9–1.25 is treated as consistent (freight and insurance); outside that range the app warns about timing, classification or transfer-pricing differences.')],
    [T('관리자용: COMTRADE_KEY를 넣으면','For admins: with a COMTRADE_KEY'),T('정식 API로 한 번에 최대 12개 기간·10만 행을 받아 조회 횟수가 약 12분의 1로 줄고, 500행 제한이 사라집니다. 운송 수단별 자료를 내는 보고국(독일 등 일부 국가)은 상단에 항공·해상·육상 선택이 나타납니다. 한국은 UN Comtrade에 운송 수단별 자료를 내지 않습니다.','The official API returns up to 12 periods and 100,000 rows per call, cutting calls about 12× and removing the 500-row limit. Reporters that publish transport-mode breakdowns (e.g. Germany) get an air/sea/land selector. Korea does not publish this breakdown to UN Comtrade.')],
   [T('경쟁사 비교 (식약처 허가·DMF)','Competitors (MFDS permits, DMF)'),T('품목 점유율은 식약처 의약품 제품 허가정보 42,704건(2026-10-19 기준) 중 유효 허가 품목 수 기준이며 매출 점유율이 아닙니다. 성분은 제품명에 함께 적힌 한글 성분명으로 영문 성분과 짝을 지었습니다. 원료 조달 단가는 업체가 등록한 원료 제조국의 평균 수입 단가로 추정합니다. 원료 등록은 식약처 원료의약품 등록(DMF) 현황 9,184건(2026-10-19 기준)에서 성분별로 국내 업체·제조소·제조국을 집계합니다. HS 품목은 한글 성분명 키워드로 연결합니다. 등록은 취급 자격 기록이라 실제 구매량·가격은 알 수 없습니다. DATA_GO_KR_KEY를 넣으면 최신 자료를 실시간으로 조회합니다.','Counts Korean companies, sites and countries per ingredient from 9,184 MFDS DMF records (as of 2026-10-19). HS codes are linked by Korean ingredient keywords. A DMF registration shows eligibility to supply, not actual purchases. With DATA_GO_KR_KEY the latest data is fetched live.')],
   [T('국가별 규제 (PIC/S·WHO)','Regulators (PIC/S, WHO)'),T('PIC/S 회원 당국 명단(2026-10-20 확인), WHO 공인 규제기관(WLA, 2025년 12월 목록), WHO 성숙도 3·4 국가(2026년 8월 목록)와 120여 개국 규제기관 공식 명칭을 씁니다. 이 표시들은 규제 체계를 가늠하는 참고 지표일 뿐, 실제 등록 요건은 국가·품목마다 다릅니다.','Uses the PIC/S member list (checked 2026-10-20), WHO-Listed Authorities (Dec 2025 list), WHO ML3/ML4 countries (Aug 2026 list) and official regulator names for 120+ countries. These are reference indicators; registration rules vary by country and product.')],
    [T('기간 선택','Periods'),T('UN Comtrade가 해당 보고국 자료를 실제로 공개한 최신 기간부터 거꾸로 N개 기간을 가져옵니다. 각국 보고 후 반영까지 수개월이 걸리므로, 최신 자료가 오래됐으면 화면에 안내합니다. 한국은 관세청 HSK 10단위 자료를 CSV로 올리면 더 최신·더 세분된 단가로 비교할 수 있습니다.','The latest N periods that UN Comtrade has actually published for the reporter are used. Publication lags by months, and the app tells you when the latest data is old. For Korea, uploading 10-digit HSK data from Korea Customs gives more recent and more specific prices.')],
    [T('조건 환산 (인코텀즈 2020)','Term conversion (Incoterms 2020)'),T('모든 조건을 FOB(=FCA·FAS) 값으로 바꾼 뒤 통계 기준으로 다시 계산합니다. CFR·CPT = FOB + 운임(FOB 대비 % 또는 USD/kg). CIF·CIP = CFR ÷ (1 − 1.1 × 보험료율) — 계약금액의 110%를 부보하는 규칙입니다. EXW = FOB ÷ (1 + 수출지 비용%). DAP·DPU = CIF × (1 + 도착지 비용%). DDP = DAP + CIF × 관세율%(관세는 CIF 과세가격 기준), 부가세 제외. 미국·캐나다·호주 등은 FOB 기준으로 과세하고, 인코텀즈 DDP는 원칙적으로 수입 부가세까지 포함하니 견적의 부가세 포함 여부를 확인하세요.','Every term is converted via FOB (= FCA, FAS). CFR/CPT = FOB + freight (% of FOB or USD/kg). CIF/CIP = CFR ÷ (1 − 1.1 × premium rate), the 110% cover rule. EXW = FOB ÷ (1 + origin costs %). DAP/DPU = CIF × (1 + destination costs %). DDP = DAP + CIF × duty % (duty on the CIF customs value), excluding VAT. The US, Canada and Australia levy duty on FOB value, and Incoterms DDP normally includes import VAT, so check whether a quote includes it.')],
    [T('변동·집중도','Change & concentration'),T('최근 변동은 마지막 3개 기간과 그 앞 3개 기간을 같은 나라끼리 비교한 값입니다(두 기간 중 작은 물량으로 가중). 싼 나라·비싼 나라 비중이 바뀌어 생기는 평균 변화(구성 효과)는 따로 표시합니다. HHI는 점유율 제곱합 × 10,000이며 미국 법무부·FTC 2023년 기준을 따라 1,800 초과를 고집중으로 봅니다.','Change compares the last 3 periods with the 3 before, country by country (weighted by the smaller of the two volumes); mix effects are shown separately. HHI = Σ share² × 10,000; above 1,800 is highly concentrated (2023 US DOJ/FTC guidelines).')],

function parseCSV(text){

function readFile(file){

  if(/\.xlsx?$/i.test(file.name)){S.imp={error:T('엑셀 파일은 바로 읽을 수 없습니다. "다른 이름으로 저장 → CSV(쉼표로 분리)"로 저장한 뒤 올려 주세요.','Excel files cannot be read directly. Save as CSV first.')};render();return}
  const rd=new FileReader();
  rd.onload=()=>{const buf=rd.result;let text=new TextDecoder('utf-8').decode(buf);if(text.includes(String.fromCharCode(0xFFFD))){try{text=new TextDecoder('euc-kr').decode(buf)}catch(e){}}S.imp=importCSV(text,file.name,vu,wu);render()};
